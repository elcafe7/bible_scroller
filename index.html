<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>try{var t=JSON.parse(localStorage.getItem("bible_scroller.v1")||"null");document.documentElement.dataset.theme=t&&t.theme==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
    <title>Scroll</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="state-stopped mode-vertical">
    <main id="stage" aria-label="Scrolling passage" hidden>
      <div id="track"></div>
    </main>

    <div id="error" class="error" role="alert" hidden>
      <p class="error-msg"></p>
      <p class="error-help"></p>
    </div>

    <section id="chrome" class="chrome" aria-label="Scroller settings">
      <header class="chrome-head">
        <h1>Scroll</h1>
        <p class="edition">Geneva Bible (1599)</p>
      </header>

      <fieldset class="range">
        <legend>Start at</legend>
        <label class="field">
          <span>Sample</span>
          <select id="sample" aria-label="Sample passage"></select>
        </label>
        <label class="field book-field">
          <span>Book</span>
          <select id="book"></select>
        </label>
        <label class="field"><span>Chapter &amp; verse</span>
          <span class="cv"><select id="sch" aria-label="Start chapter"></select><b>:</b><select id="sv" aria-label="Start verse"></select></span>
        </label>
        <p class="range-hint">Reads to the end of the book, then loops.</p>
      </fieldset>

      <div class="options">
        <div class="commentary-opt">
          <div class="commentary" role="radiogroup" aria-label="Commentary">
            <button type="button" role="radio" data-commentary="none">No commentary</button>
            <button type="button" role="radio" data-commentary="henry">Matthew Henry</button>
            <button type="button" role="radio" data-commentary="calvin">Calvin</button>
          </div>
          <p class="toggle-hint">Commentary comes in chunks (often several verses), not after every verse.</p>
          <p class="toggle-hint henry-na" id="henry-na" hidden></p>
        </div>
        <div class="speed" role="radiogroup" aria-label="Speed">
          <button type="button" role="radio" data-speed="slow">Slow</button>
          <button type="button" role="radio" data-speed="medium">Medium</button>
          <button type="button" role="radio" data-speed="fast">Fast</button>
        </div>
        <div class="size" role="radiogroup" aria-label="Text size">
          <button type="button" role="radio" data-size="s" aria-label="Small text">A</button>
          <button type="button" role="radio" data-size="m" aria-label="Medium text">A</button>
          <button type="button" role="radio" data-size="l" aria-label="Large text">A</button>
          <button type="button" role="radio" data-size="xl" aria-label="Extra large text">A</button>
        </div>
        <div class="theme" role="radiogroup" aria-label="Theme">
          <button type="button" role="radio" data-theme-choice="light">Light</button>
          <button type="button" role="radio" data-theme-choice="dark">Dark</button>
        </div>
        <div class="mode" role="radiogroup" aria-label="Scroll mode">
          <button type="button" role="radio" data-mode="vertical">Vertical</button>
          <button type="button" role="radio" data-mode="horizontal">Ticker</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="play" class="primary">Start</button>
        <button type="button" id="restart">Restart</button>
      </div>
    <p class="hint">Start opens a full-screen scroll. Esc, Space, or a double-tap returns here.</p>
    </section>

    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <p id="boot" class="boot">Loading…</p>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
