<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>try{var t=JSON.parse(localStorage.getItem("bible_scroller.v1")||"null");document.documentElement.dataset.theme=t&&t.theme==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
    <title>Scroll</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="state-stopped mode-vertical">
    <main id="stage" aria-label="Scrolling passage" hidden>
      <div id="track"></div>
    </main>

    <div id="error" class="error" role="alert" hidden>
      <p class="error-msg"></p>
      <p class="error-help"></p>
    </div>

    <section id="chrome" class="chrome" aria-label="Scroller settings">
      <header class="chrome-head">
        <div class="brand">
          <a class="ap-link" href="https://apocalypse.press/" target="_blank" rel="noopener noreferrer" aria-label="Apocalypse Press home">
            <span class="wordmark-mark" aria-hidden="true">AP</span>
          </a>
          <a class="wordmark" href="./" aria-label="Scroll home">
            <span class="wordmark-mark" aria-hidden="true">S</span>
            <span>Scroll</span>
          </a>
        </div>
      </header>

      <fieldset class="range">
        <legend>Start at</legend>
        <button type="button" class="passage-btn" id="passage-btn" aria-haspopup="dialog" aria-controls="picker" title="Choose passage">
          <span class="passage-field">
            <svg class="passage-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span id="passage-label">John 3:16 · Geneva 1599</span>
            <svg class="passage-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </span>
        </button>
        <p class="range-hint">Reads to the end of the book, then loops.</p>
      </fieldset>

      <div class="options">
        <div class="commentary-opt">
          <div class="commentary" role="radiogroup" aria-label="Commentary">
            <button type="button" role="radio" data-commentary="none">No commentary</button>
            <button type="button" role="radio" data-commentary="henry">Matthew Henry</button>
            <button type="button" role="radio" data-commentary="calvin">Calvin</button>
          </div>
          <p class="toggle-hint">Commentary comes in chunks (often several verses), not after every verse.</p>
          <p class="toggle-hint henry-na" id="henry-na" hidden></p>
        </div>
        <div class="speed" role="radiogroup" aria-label="Speed">
          <button type="button" role="radio" data-speed="very-slow">Very Slow</button>
          <button type="button" role="radio" data-speed="slow">Slow</button>
          <button type="button" role="radio" data-speed="medium">Medium</button>
          <button type="button" role="radio" data-speed="fast">Fast</button>
        </div>
        <div class="size" role="radiogroup" aria-label="Text size">
          <button type="button" role="radio" data-size="s" aria-label="Small text">A</button>
          <button type="button" role="radio" data-size="m" aria-label="Medium text">A</button>
          <button type="button" role="radio" data-size="l" aria-label="Large text">A</button>
          <button type="button" role="radio" data-size="xl" aria-label="Extra large text">A</button>
        </div>
        <div class="theme" role="radiogroup" aria-label="Theme">
          <button type="button" role="radio" data-theme-choice="light">Light</button>
          <button type="button" role="radio" data-theme-choice="dark">Dark</button>
        </div>
        <div class="mode" role="radiogroup" aria-label="Scroll mode">
          <button type="button" role="radio" data-mode="vertical">Vertical</button>
          <button type="button" role="radio" data-mode="horizontal">Ticker</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="play" class="primary">Start</button>
        <button type="button" id="restart">Restart</button>
      </div>
      <p class="hint">Start opens a full-screen scroll. Esc, Space, or a double-tap returns here.</p>
    </section>


    <div class="picker-backdrop" id="picker" hidden>
      <div class="picker-card" role="dialog" aria-modal="true" aria-labelledby="picker-title">
        <div class="picker-rule">
          <span></span>
          <h1 id="picker-title">Choose passage</h1>
          <span></span>
        </div>
        <button class="picker-close" id="picker-close" type="button" aria-label="Close">✕</button>
        <div class="picker-body">
          <div class="segmented" id="picker-editions" role="group" aria-label="Edition"></div>
          <div class="picker-nav" id="picker-nav" hidden>
            <button class="picker-back" id="picker-back" type="button">‹ Books</button>
            <p class="picker-crumb" id="picker-crumb"></p>
          </div>
          <div id="picker-step-books">
            <label class="sr-only" for="picker-book-filter">Book or reference</label>
            <input class="picker-filter" id="picker-book-filter" type="search" placeholder="Book or reference, e.g. 1 John 3:16" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
            <p class="picker-hint" id="picker-hint" role="status" aria-live="polite"></p>
            <div id="picker-books"></div>
          </div>
          <div class="picker-grid numbers" id="picker-numbers" hidden></div>
        </div>
      </div>
    </div>

    <footer id="site-footer">
      <p class="shortcuts"><kbd>Esc</kbd><kbd>Space</kbd> return</p>
      <p class="offline-note">a project of <a href="https://jesuspeoplesf.com" target="_blank" rel="noopener noreferrer">JPSF</a> &amp; <a href="https://apocalypse.press" target="_blank" rel="noopener noreferrer">AP</a></p>
    </footer>

    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <p id="boot" class="boot">Loading…</p>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
